[tool.uv.workspace]
members = ["lib", "pipeline", "api"]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "httpx2>=0.1",
    "hypothesis>=6.155.5",
    "networkx-stubs>=0.0.1",
    "pytest>=8.0",
    "pyright>=1.1",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["lib/tests", "pipeline/tests", "api/tests"]
