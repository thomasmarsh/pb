<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pb explore — indexing…</title>
<style>
%%VIZ_ROOT_CSS%%
  body {
    background: var(--surface-1);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  h1 { font-weight: 600; font-size: 1.3rem; }
  #current-line { font-size: 1.05rem; margin: 1rem 0 0.5rem; }
  #current-line .elapsed { color: var(--text-secondary); }
  ul#worker-rows { list-style: none; padding: 0; margin: 0 0 1.5rem; font-size: 0.9rem; color: var(--text-secondary); }
  ul#worker-rows li { padding: 0.15rem 0; }
  #status-banner { padding: 0.75rem 1rem; border-radius: 6px; margin: 1rem 0; }
  #status-banner.done { background: color-mix(in srgb, var(--series-5) 15%, transparent); }
  #status-banner.error { background: color-mix(in srgb, #b25400 15%, transparent); color: #b25400; }
  #view-explorer { color: var(--series-1); }
</style>
</head>
<body class="viz-root">
<h1>Indexing…</h1>
<div id="status-banner" style="display:none"></div>
<div id="timeline"></div>
<div id="current-line"></div>
<ul id="worker-rows"></ul>
<script>
function fmtMs(ms) {
  if (ms === null || ms === undefined) return "";
  return (ms / 1000).toFixed(1) + "s";
}

function renderCurrent(label, elapsedMs, residencyMb) {
  var el = document.getElementById("current-line");
  if (!label) { el.textContent = ""; return; }
  var text = label + " \u2014 " + fmtMs(elapsedMs);
  if (residencyMb != null) text += " (" + Math.round(residencyMb) + "MB RES)";
  el.textContent = text.trim();
}

function renderWorkers(workers) {
  var el = document.getElementById("worker-rows");
  el.innerHTML = "";
  for (var i = 0; i < workers.length; i++) {
    var w = workers[i];
    var li = document.createElement("li");
    li.textContent = "Worker " + w.worker + " \u2014 " + w.file + " (" + fmtMs(w.elapsed_ms) + ")";
    el.appendChild(li);
  }
}

function renderTimeline(html) {
  document.getElementById("timeline").innerHTML = html || "";
}

function showBanner(kind, message) {
  var el = document.getElementById("status-banner");
  el.className = kind;
  el.style.display = "block";
  el.innerHTML = message;
}

// ── timer state ──
// Anchor: serverElapsed_ms at last snapshot, wall-clock time of that snapshot
var serverElapsed = 0;
var anchorTime = 0;
var timerInterval = null;

function tick() {
  var now = serverElapsed + (Date.now() - anchorTime);
  var current = lastSnapshot && lastSnapshot.current;
  if (current) {
    var stepElapsed = now - (current.start_since_start_ms || 0);
    renderCurrent(current.label, stepElapsed, current.residency_mb);
  }
  // Tick worker elapsed times too
  var workers = lastSnapshot && lastSnapshot.workers;
  if (workers && workers.length) {
    renderWorkers(workers.map(function(w) {
      return {
        worker: w.worker,
        file: w.file,
        elapsed_ms: w.start_since_start_ms !== null ? now - w.start_since_start_ms : null
      };
    }));
  }
}

var lastSnapshot = null;

function handleSnapshot(data) {
  lastSnapshot = data;
  serverElapsed = data.elapsed_ms || 0;
  anchorTime = Date.now();

  if (data.current) {
    var stepElapsed = serverElapsed - (data.current.start_since_start_ms || 0);
    renderCurrent(data.current.label, stepElapsed, data.current.residency_mb);
  } else {
    renderCurrent(null, null, null);
  }

  renderWorkers(data.workers || []);
  renderTimeline(data.timeline_html);

  if (data.job_status === "done") {
    onDone();
    return;
  }
  if (data.job_status === "error") {
    onError(data);
    return;
  }

  // Start ticking if not already
  if (!timerInterval) {
    timerInterval = setInterval(tick, 1000);
  }
}

function onDone() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  showBanner("done", "Indexing complete. <a id=\"view-explorer\" href=\"/\">View Explorer &rarr;</a>");
  setTimeout(function() { window.location.href = "/"; }, 1500);
}

function onError(data) {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  showBanner("error", "Indexing failed: " + (data.error || "unknown error") +
    " <a id=\"view-explorer\" href=\"/\">View Explorer &rarr;</a>");
}

// ── SSE connection ──
var es = new EventSource("/api/index-events");

es.onmessage = function(ev) {
  var data = JSON.parse(ev.data);

  if (!data.active) {
    showBanner("done", "No active index run. <a id=\"view-explorer\" href=\"/\">View Explorer &rarr;</a>");
    es.close();
    return;
  }

  handleSnapshot(data);
};

es.onerror = function() {
  // EventSource auto-reconnects after transient failures
};
</script>
</body>
</html>
