<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pb explore — indexing…</title>
<style>
%%VIZ_ROOT_CSS%%
  body {
    background: var(--surface-1);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  h1 { font-weight: 600; font-size: 1.3rem; }
  #current-line { font-size: 1.05rem; margin: 1rem 0 0.5rem; }
  #current-line .elapsed { color: var(--text-secondary); }
  ul#worker-rows { list-style: none; padding: 0; margin: 0 0 1.5rem; font-size: 0.9rem; color: var(--text-secondary); }
  ul#worker-rows li { padding: 0.15rem 0; }
  #status-banner { padding: 0.75rem 1rem; border-radius: 6px; margin: 1rem 0; }
  #status-banner.done { background: color-mix(in srgb, var(--series-5) 15%, transparent); }
  #status-banner.error { background: color-mix(in srgb, #b25400 15%, transparent); color: #b25400; }
  #view-explorer { color: var(--series-1); }
</style>
</head>
<body class="viz-root">
<h1>Indexing…</h1>
<div id="status-banner" style="display:none"></div>
<div id="timeline"></div>
<div id="current-line"></div>
<ul id="worker-rows"></ul>
<script>
function fmtMs(ms) {
  if (ms === null || ms === undefined) return "";
  return (ms / 1000).toFixed(1) + "s";
}

function renderCurrent(current) {
  const el = document.getElementById("current-line");
  if (!current) {
    el.textContent = "";
    return;
  }
  let text = current.label + " ";
  text += "— " + fmtMs(current.elapsed_ms) + " ";
  if (current.residency_mb) text += "(" + Math.round(current.residency_mb) + "MB RES) ";
  el.textContent = text.trim();
}

function renderWorkers(workers) {
  const el = document.getElementById("worker-rows");
  el.innerHTML = "";
  for (const w of workers) {
    const li = document.createElement("li");
    li.textContent = "Worker " + w.worker + " — " + w.file + " (" + fmtMs(w.elapsed_ms) + ")";
    el.appendChild(li);
  }
}

function renderTimeline(timelineHtml) {
  document.getElementById("timeline").innerHTML = timelineHtml || "";
}

function showBanner(kind, message) {
  const el = document.getElementById("status-banner");
  el.className = kind;
  el.style.display = "block";
  el.innerHTML = message;
}

let polling = true;

async function poll() {
  if (!polling) return;
  let data;
  try {
    const r = await fetch("/api/index-progress");
    data = await r.json();
  } catch (e) {
    setTimeout(poll, 1000);
    return;
  }

  if (!data.active) {
    showBanner("done", "No active index run. <a id=\"view-explorer\" href=\"/\">View Explorer &rarr;</a>");
    polling = false;
    return;
  }

  renderCurrent(data.current);
  renderWorkers(data.workers || []);
  renderTimeline(data.timeline_html);

  if (data.job_status === "done") {
    polling = false;
    showBanner("done", "Indexing complete. <a id=\"view-explorer\" href=\"/\">View Explorer &rarr;</a>");
    setTimeout(() => { window.location.href = "/"; }, 1500);
    return;
  }
  if (data.job_status === "error") {
    polling = false;
    showBanner("error", "Indexing failed: " + (data.error || "unknown error") +
      " <a id=\"view-explorer\" href=\"/\">View Explorer &rarr;</a>");
    return;
  }

  setTimeout(poll, 1000);
}

poll();
</script>
</body>
</html>
