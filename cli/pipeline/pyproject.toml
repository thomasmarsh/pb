[project]
name = "pb-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pb-lib",
    "duckdb>=0.10",
    "graphviz>=0.21",
    "networkx>=3.3",
    "rich>=13.0",
    "scipy>=1.11",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
    "mysql-connector-python>=9.0",
    "scalar-fastapi>=1.8.2",
]

[project.scripts]
pb = "pb.pipeline.cli:app"
pb-sql-worker = "pb.pipeline.bridge.sql_worker:main"

[tool.uv.sources]
pb-lib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pb"]
