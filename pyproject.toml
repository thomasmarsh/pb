[project]
name = "pb-tools"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.10",
    "graphviz>=0.21",
    "networkx>=3.3",
    "rich>=13.0",
    "scipy>=1.11",
    "typer>=0.12",
]

[project.scripts]
pb = "pbtools.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbtools"]

[dependency-groups]
dev = [
    "networkx-stubs>=0.0.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["pytests"]
