name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache GHC
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/.ghcup/ghc/9.10.2
            /usr/local/.ghcup/bin
          key: ghcup-${{ runner.os }}-ghc-9.10.2-v2

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.2"
          cabal-version: "3.12"

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: cabal-${{ runner.os }}-ghc-9.10.2-duckdb-1.5.4-${{ hashFiles('compiler/pb-ast.cabal') }}
          restore-keys: |
            cabal-${{ runner.os }}-ghc-9.10.2-duckdb-1.5.4-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB library
        run: |
          wget -q https://github.com/duckdb/duckdb/releases/download/v1.5.4/libduckdb-linux-amd64.zip
          unzip -q libduckdb-linux-amd64.zip -d /tmp/duckdb
          sudo cp /tmp/duckdb/libduckdb.so /usr/local/lib/
          sudo cp /tmp/duckdb/duckdb.h /usr/local/include/
          sudo ldconfig

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Souffle
        run: |
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:souffle-lang/souffle
          sudo apt-get update
          sudo apt-get install -y souffle

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.3.0"

      - name: Build
        working-directory: compiler
        run: cabal build --enable-tests

      - name: Extract openpay corpus
        run: uv run --project cli pb extract example/openpay-0.1.1b -o example/openpay-0.1.1b-extract

      - name: Test (Haskell)
        working-directory: compiler
        run: cabal test --test-show-details=direct

      - name: Test (Python)
        working-directory: cli
        run: uv run ruff check && uv run pyright && uv run pytest

      - name: Test (TypeScript)
        working-directory: ui
        run: pnpm lint && pnpm typecheck && pnpm test

      - name: Build (TypeScript)
        working-directory: ui
        run: pnpm build
